environment:
  name: FluxRoute
  version: "1.1.0"
  description: >
    An industry-grade Reinforcement Learning environment for adaptive network 
    routing, modeling M/M/1 queuing theory, OSPF link-state convergence, 
    and real-world Router ASIC telemetry (SNMP/BFD/INT).
  author: FluxRoute Team
  license: MIT
  tags: [networking, routing, rl, gnn, openenv]

tasks:
  - id: easy_static_mesh
    description: "4x4 Grid with steady traffic. Objective: Minimize end-to-end latency."
    difficulty: easy
    grader:
      type: deterministic
      method: weighted_metrics
      score_range: [0.0, 1.0]
      metrics:
        - latency_score
        - tail_score
        - loss_score
        - balance_score
        - throughput_score
  - id: medium_bursty_dc
    description: "3-Tier Clos topology with micro-burst hotspots. Objective: Load balance across links."
    difficulty: medium
    grader:
      type: deterministic
      method: weighted_metrics
      score_range: [0.0, 1.0]
      metrics:
        - latency_score
        - tail_score
        - loss_score
        - balance_score
        - throughput_score
  - id: hard_failure_shift
    description: "Multi-path graph with sudden 50ms link failures. Objective: Rapid OSPF-aware detour selection."
    difficulty: hard
    grader:
      type: deterministic
      method: weighted_metrics
      score_range: [0.0, 1.0]
      metrics:
        - latency_score
        - tail_score
        - loss_score
        - balance_score
        - throughput_score
  - id: research_burst
    description: "Heavy-load research topology. Objective: Test boundary of M/M/1 queue stability."
    difficulty: research
    grader:
      type: deterministic
      method: weighted_metrics
      score_range: [0.0, 1.0]
      metrics:
        - latency_score
        - tail_score
        - loss_score
        - balance_score
        - throughput_score

action_space:
  type: discrete
  shape: [8]
  description: >
    Selection of the next-hop index (0-7) for the current packet. 
    Indices map to local physical ports on the router. 
    Action masking is used to filter out dead or disconnected links.

observation_space:
  type: box
  shape: [62]
  description: >
    62-dimensional vector of real-world telemetry:
    - [0-55]: 7 features per neighbor (queue depth, trend, utilization, BFD latency, 
      status mask, neighbor-avg-util, hops-to-dest).
    - [56-61]: Global packet metadata (DSCP priority, accumulated latency, 
      TTL/hops taken, distance-to-dest, mesh-avg-utilization).

inference:
  script: inference.py
  max_runtime_minutes: 20
  target_runtime_minutes: 10
  vcpu: 2
  memory_gb: 8

resources:
  max_vcpu: 2
  max_ram_gb: 8
  gpu_required: false

docker:
  port: 7860
  dockerfile: Dockerfile
  start_command: ./start.sh
